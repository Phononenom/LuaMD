# .github/workflows/build.yml
name: Build LuaMD

on:
  push:
    branches: [ main, master ]
    tags: [ '*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils make python3

      - name: Build dist/LuaMD
        run: |
          make clean
          make dist

      - name: Show manifest
        run: cat dist/LuaMD/manifest

      - name: Show artifact sizes
        run: |
          ls -l dist/LuaMD/
          stat -c '%n %s bytes' dist/LuaMD/payload.bin

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: LuaMD-dist
          path: dist/LuaMD/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LuaMD-dist
          path: LuaMD-dist

      - name: Package for release
        run: |
          cd LuaMD-dist
          zip -r ../LuaMD.zip .
          cd ..
          ls -lh LuaMD.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: LuaMD.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
